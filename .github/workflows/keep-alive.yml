name: Keep alive (Render)

# O backend roda no plano grátis do Render, que "dorme" depois de ~15 min sem
# nenhuma requisição e leva minutos pra acordar na próxima visita. Este job
# bate no endpoint de saúde a cada 5 minutos, de FORA do servidor (um robô
# dentro do próprio app não funciona: quando o servidor dorme, o robô dorme
# junto), mantendo-o acordado. O /actuator/health também consulta o banco,
# então ajuda a manter o Neon acordado.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /actuator/health
        run: |
          curl --silent --show-error --location \
            --retry 5 --retry-delay 20 --retry-all-errors \
            --max-time 120 \
            --write-out "\nHTTP %{http_code} em %{time_total}s\n" \
            "https://carrawave-app-api.onrender.com/actuator/health"
