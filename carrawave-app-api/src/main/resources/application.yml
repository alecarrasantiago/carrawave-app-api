server:
  port: ${PORT:8080}
  # Necessário atrás de proxy (Railway/Render/Nginx) para o Spring enxergar
  # corretamente que a requisição chegou por HTTPS (X-Forwarded-Proto).
  forward-headers-strategy: framework
  # Comprime as respostas JSON (a lista de rádios é o maior payload do app) —
  # ajuda bastante em conexão de celular, que é o cenário principal do app.
  compression:
    enabled: true
    mime-types: application/json,text/html,text/plain,text/css,application/javascript
    min-response-size: 1024

spring:
  application:
    name: carrawave-app-api
  profiles:
    # Ative com SPRING_PROFILES_ACTIVE=local para dev na sua máquina (lê
    # application-local.yml, que NUNCA vai para o Git). Em produção, todos
    # os valores abaixo vêm de variáveis de ambiente do provedor.
    active: ${SPRING_PROFILES_ACTIVE:}
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    # Neon grátis: o banco só "dorme" (e para de gastar a cota de compute)
    # depois de 5 min SEM conexão. Por padrão o Hikari mantém 10 conexões
    # abertas para sempre e as recria a cada 30 min — isso acordava o banco
    # de meia em meia hora mesmo sem ninguém usando. Com minimum-idle 0 o
    # pool esvazia sozinho 30 s depois da última consulta.
    hikari:
      minimum-idle: 0
      maximum-pool-size: 5
      idle-timeout: 30000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        # Evita N+1: sem isso, cada rádio listada faz 2 consultas extras
        # (cidade e gêneros, ambos lazy) uma por uma — 60 rádios numa página
        # viravam ~120 idas ao banco só pra montar a lista. Com isso, o
        # Hibernate agrupa essas buscas em poucas consultas "IN (...)" pro
        # lote inteiro, que era o maior motivo do app demorar pra carregar.
        default_batch_fetch_size: 50
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
  jackson:
    time-zone: UTC
    default-property-inclusion: non_null
    # Nunca serializa campos que não existem explicitamente no DTO — evita
    # vazar campos de entidade por engano caso alguém retorne a entity direto.
    serialization:
      fail-on-empty-beans: false

carrawave:
  jwt:
    secret: ${JWT_SECRET}
    access-ttl-minutes: 60
    refresh-ttl-days: 60
  cors:
    origins: ${CORS_ORIGINS}
  rate-limit:
    capacity: ${RATE_LIMIT_CAPACITY:60}
    refill-per-minute: ${RATE_LIMIT_CAPACITY:60}
    auth-capacity: ${AUTH_RATE_LIMIT_CAPACITY:10}

management:
  # O /actuator/health é chamado a cada 5 min pelo keep-alive do Render
  # (GitHub Actions + KeepAliveScheduler). Com o check do banco ligado, cada
  # ping fazia uma consulta no Neon e ele NUNCA dormia — foi isso que estourou
  # a cota grátis de compute. O health agora só diz se a aplicação está de pé.
  health:
    db:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    br.com.carrawave: INFO
  # Nunca deixe DEBUG em org.hibernate.SQL/org.springframework.security em produção:
  # pode vazar parâmetros de query (incluindo dados de usuário) no log.
