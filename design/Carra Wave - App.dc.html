<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Figtree:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#e6ddcc;font-family:Figtree,system-ui,sans-serif}
a{color:#8c491a;text-decoration:none}a:hover{color:#643312}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:rgba(32,30,29,.22);border-radius:9px}
</style>
</helmet>

<div style="display:flex;align-items:flex-start;gap:34px;padding:32px 36px 60px;min-height:100vh;box-sizing:border-box">

  <!-- rail -->
  <div style="position:sticky;top:32px;flex:none;width:214px;display:flex;flex-direction:column;gap:18px">
    <div>
      <div style="display:flex;align-items:center;gap:10px">
        <div style="width:36px;height:36px;border-radius:999px;background:#c67139;display:flex;align-items:center;justify-content:center">
          <svg width="20" height="20" viewBox="0 0 32 32" fill="none" stroke="#fffaf1" stroke-width="2.75" stroke-linecap="round"><circle cx="16" cy="16" r="3.2" fill="#fffaf1" stroke="none"></circle><path d="M10.2 10.2a8.2 8.2 0 000 11.6"></path><path d="M21.8 10.2a8.2 8.2 0 010 11.6"></path></svg>
        </div>
        <span style="font:400 19px Caprasimo,serif;color:#201e1d">Carra Wave</span>
      </div>
      <div style="font:500 12px/1.5 Figtree;color:rgba(32,30,29,.55);margin-top:10px">Protótipo navegável · pt-BR<br>Claro e escuro em paralelo.</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:3px">
      <sc-for list="{{ rail }}" as="r" hint-placeholder-count="14">
        <div onClick="{{ r.onPick }}" style="cursor:pointer;display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:999px;background:{{ r.bg }};color:{{ r.fg }};font:600 12.5px Figtree" style-hover="background:rgba(32,30,29,.07)">
          <span style="font:500 10px 'IBM Plex Mono',monospace;opacity:.65;width:16px">{{ r.n }}</span>{{ r.label }}
        </div>
      </sc-for>
    </div>
    <div style="padding:13px 15px;border-radius:20px;background:rgba(32,30,29,.06);font:500 11.5px/1.6 Figtree;color:rgba(32,30,29,.6)">
      Os dois aparelhos compartilham o mesmo estado: tocar, favoritar ou navegar em um reflete no outro.
    </div>
  </div>

  <!-- light phone -->
  <div style="flex:none;display:flex;flex-direction:column;gap:12px">
    <div style="display:flex;align-items:center;gap:8px;padding-left:6px">
      <div style="width:11px;height:11px;border-radius:999px;background:#f5ead8;border:1.5px solid rgba(32,30,29,.25)"></div>
      <span style="font:700 12px Figtree;color:rgba(32,30,29,.7);letter-spacing:.02em">MODO CLARO · Android</span>
    </div>
    <div style="--bg:#f5ead8;--surf:#fffaf1;--surf2:#ebddc5;--ink:#201e1d;--ink60:rgba(32,30,29,.62);--ink40:rgba(32,30,29,.42);--line:rgba(32,30,29,.14);--accent:#c67139;--accent-2:#7a8a5e;--accent-soft:rgba(198,113,57,.13);--accent-ink:#8c491a;--onacc:#fffaf1;--shadow-sm:0 1px 2px rgba(46,43,37,.14);--shadow-md:0 4px 14px rgba(46,43,37,.16);--shadow-lg:0 12px 32px rgba(46,43,37,.22);--blob:rgba(255,255,255,.24);--pl-bg:#c67139;--pl-fg:#fffaf1;--pd-bg:transparent;--pd-fg:rgba(32,30,29,.62);--t1:#ffe1d0;--tf1:#643312;--t2:#e1eecc;--tf2:#3d472b;--t3:#eee7db;--tf3:#474238;--t4:#ffc6a5;--tf4:#643312;--t5:#ccdbb2;--tf5:#3d472b;--t6:#dcd3c4;--tf6:#474238;width:412px;padding:11px;border-radius:54px;background:#201913;box-shadow:0 30px 70px -26px rgba(32,25,19,.6),0 0 0 1px rgba(32,25,19,.5)">
      <div style="position:relative;width:390px;height:822px;border-radius:44px;overflow:hidden;background:#f5ead8">
        <dc-import name="RadioTunePhone" dc-props="{{ app }}" hint-size="390px,822px" style="position:absolute;inset:0"></dc-import>
        <div style="position:absolute;top:14px;left:50%;transform:translateX(-50%);width:9px;height:9px;border-radius:999px;background:#201913;opacity:.75;pointer-events:none"></div>
      </div>
    </div>
  </div>

  <!-- dark phone -->
  <div style="flex:none;display:flex;flex-direction:column;gap:12px">
    <div style="display:flex;align-items:center;gap:8px;padding-left:6px">
      <div style="width:11px;height:11px;border-radius:999px;background:#17120e"></div>
      <span style="font:700 12px Figtree;color:rgba(32,30,29,.7);letter-spacing:.02em">MODO ESCURO · Android</span>
    </div>
    <div style="--bg:#17120e;--surf:#241c15;--surf2:#32271d;--ink:#f7eede;--ink60:rgba(247,238,222,.64);--ink40:rgba(247,238,222,.4);--line:rgba(247,238,222,.13);--accent:#f6a06b;--accent-2:#aebf92;--accent-soft:rgba(246,160,107,.16);--accent-ink:#ffc6a5;--onacc:#3a1f0e;--shadow-sm:0 1px 2px rgba(0,0,0,.5);--shadow-md:0 4px 16px rgba(0,0,0,.5);--shadow-lg:0 12px 34px rgba(0,0,0,.6);--blob:rgba(255,255,255,.07);--pl-bg:transparent;--pl-fg:rgba(247,238,222,.64);--pd-bg:#f6a06b;--pd-fg:#3a1f0e;--t1:#4a2a19;--tf1:#ffc6a5;--t2:#2f3a24;--tf2:#ccdbb2;--t3:#332b22;--tf3:#eee7db;--t4:#5c331b;--tf4:#ffd7bd;--t5:#3a4629;--tf5:#e1eecc;--t6:#3b3227;--tf6:#dcd3c4;width:412px;padding:11px;border-radius:54px;background:#0d0a07;box-shadow:0 30px 70px -26px rgba(32,25,19,.6),0 0 0 1px rgba(32,25,19,.5)">
      <div style="position:relative;width:390px;height:822px;border-radius:44px;overflow:hidden;background:#17120e">
        <dc-import name="RadioTunePhone" dc-props="{{ app }}" hint-size="390px,822px" style="position:absolute;inset:0"></dc-import>
        <div style="position:absolute;top:14px;left:50%;transform:translateX(-50%);width:9px;height:9px;border-radius:999px;background:#0d0a07;opacity:.75;pointer-events:none"></div>
      </div>
    </div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const GR = [
  'linear-gradient(145deg,#f6a06b,#b2622d)',
  'linear-gradient(145deg,#aebf92,#56633f)',
  'linear-gradient(145deg,#ffc6a5,#d67f48)',
  'linear-gradient(145deg,#c0b6a5,#5a5246)',
  'linear-gradient(145deg,#d67f48,#643312)',
  'linear-gradient(145deg,#ccdbb2,#728157)',
  'linear-gradient(145deg,#f6a06b,#8c491a)',
  'linear-gradient(145deg,#8fa073,#3d472b)'
];
const RAW = [
  ['jb','JB FM','99.9 FM','Rio de Janeiro','RJ','MPB','JB',0,'12,4 mil'],
  ['odia','FM O Dia','100.5 FM','Rio de Janeiro','RJ','Pagode','OD',4,'9,8 mil'],
  ['tupi','Super Rádio Tupi','96.5 FM','Rio de Janeiro','RJ','Notícias','TU',3,'8,1 mil'],
  ['melodia','Melodia','97.5 FM','Rio de Janeiro','RJ','Gospel','ME',1,'7,6 mil'],
  ['n93','93 FM','93.3 FM','Rio de Janeiro','RJ','Pop','93',2,'11,2 mil'],
  ['mixrio','Mix Rio FM','102.1 FM','Rio de Janeiro','RJ','Pop','MX',6,'10,5 mil'],
  ['bandrio','Band FM Rio','102.9 FM','Rio de Janeiro','RJ','Sertanejo','BR',5,'6,9 mil'],
  ['alpha','Alpha FM','101.7 FM','São Paulo','SP','Flashback','AL',1,'14,1 mil'],
  ['bandfm','Band FM','96.1 FM','São Paulo','SP','Sertanejo','BF',0,'13,3 mil'],
  ['antena1','Antena 1','94.7 FM','São Paulo','SP','Flashback','A1',7,'9,2 mil'],
  ['jovempan','Jovem Pan FM','100.9 FM','São Paulo','SP','Pop','JP',4,'15,7 mil'],
  ['mixsp','Mix FM São Paulo','106.3 FM','São Paulo','SP','Pop','MS',2,'12,9 mil'],
  ['nativa','Nativa FM','95.3 FM','São Paulo','SP','Sertanejo','NA',5,'8,7 mil'],
  ['bandeirantes','Rádio Bandeirantes','107.3 FM','São Paulo','SP','Notícias','BA',3,'7,4 mil']
];
const STATIONS = RAW.map(r => ({
  id: r[0], nome: r[1], freq: r[2], cidade: r[3], uf: r[4], genero: r[5], ini: r[6],
  g: GR[r[7]], ouvintes: r[8],
  desc: r[1] + ' transmite ao vivo de ' + r[3] + ' em ' + r[2] + '. A grade mistura ' +
        r[5].toLowerCase() + ', programas ao vivo e a conversa da cidade — do primeiro café até a madrugada.',
  site: 'www.' + r[0] + '.com.br'
}));
const GENRES = ['Pop','Rock','MPB','Sertanejo','Pagode','Gospel','Notícias','Esportes','Flashback','Eletrônica','Jazz','Clássica'];
const CHIPS = ['Todas','Rio de Janeiro','São Paulo','Música','Notícias','Esportes','Gospel','Pop','Rock','MPB'];
const TIMERS = ['15 minutos','30 minutos','45 minutos','1 hora','Fim do programa','Personalizado'];
const ONB = [
  ['Rádios de todo lugar','Ouça suas rádios favoritas do Rio, São Paulo e muito mais.','◉'],
  ['Tudo ao vivo','Acompanhe suas emissoras preferidas onde estiver.','∿'],
  ['Do seu jeito','Favorite estações e encontre rapidamente o que gosta de ouvir.','♥']
];
const RAIL = [
  ['splash','Splash'],['onb','Onboarding'],['login','Login'],['home','Home'],
  ['explore','Explorar'],['rio','Rio de Janeiro'],['sp','São Paulo'],['station','Detalhe da rádio'],
  ['player','Player completo'],['search','Busca'],['searchEmpty','Busca sem resultado'],
  ['fav','Favoritos'],['favEmpty','Favoritos vazio'],['recent','Ouvidas recentemente'],
  ['genres','Gêneros'],['settings','Configurações'],['guest','Config. sem login'],['timer','Temporizador'],
  ['offline','Sem conexão'],['error','Erro de stream']
];

class Component extends DCLogic {
  state = {
    screen: 'home', rail: 'home', prev: 'home',
    playingId: 'jb', isPlaying: true, playerOpen: false, timerOpen: false,
    favs: { jb: true, alpha: true, jovempan: true },
    chip: 'Todas', view: 'grid', query: '', city: 'rio', curId: 'jb',
    onbStep: 0, timer: null, autoplay: true, toast: '', forceEmptyFav: false,
    auth: 'anon'
  };

  componentWillUnmount() { clearTimeout(this._t); clearTimeout(this._s); }

  flash(msg) {
    clearTimeout(this._t);
    this.setState({ toast: msg });
    this._t = setTimeout(() => this.setState({ toast: '' }), 1700);
  }
  go(screen, extra) {
    clearTimeout(this._s);
    this.setState(s => Object.assign({ prev: s.screen, screen, playerOpen: false, timerOpen: false }, extra || {}));
    if (screen === 'splash') this._s = setTimeout(() => this.setState({ screen: 'onb', onbStep: 0 }), 2400);
  }
  jump(key) {
    this.setState({ rail: key });
    const m = {
      splash: () => this.go('splash'),
      onb: () => this.go('onb', { onbStep: 0 }),
      login: () => this.go('login'),
      guest: () => this.go('settings', { auth: 'anon' }),
      home: () => this.go('home'),
      explore: () => this.go('explore', { chip: 'Todas' }),
      rio: () => this.go('city', { city: 'rio' }),
      sp: () => this.go('city', { city: 'sp' }),
      station: () => this.go('station', { curId: 'jb' }),
      search: () => this.go('search', { query: 'mix' }),
      searchEmpty: () => this.go('search', { query: 'xyz' }),
      fav: () => this.go('fav', { forceEmptyFav: false }),
      favEmpty: () => this.go('fav', { forceEmptyFav: true }),
      recent: () => this.go('recent'),
      genres: () => this.go('genres'),
      settings: () => this.go('settings', { auth: 'conta' }),
      offline: () => this.go('offline'),
      error: () => this.go('error'),
      player: () => this.setState({ screen: 'home', playerOpen: true, timerOpen: false }),
      timer: () => this.setState({ screen: 'home', playerOpen: true, timerOpen: true })
    };
    (m[key] || m.home)();
  }
  play(st) {
    this.setState({ playingId: st.id, isPlaying: true });
    this.flash('Tocando ' + st.nome);
  }
  toggleFav(st) {
    this.setState(s => {
      const f = Object.assign({}, s.favs);
      f[st.id] = !f[st.id];
      return { favs: f, forceEmptyFav: false };
    });
    this.flash(this.state.favs[st.id] ? 'Removida dos favoritos' : st.nome + ' nos favoritos');
  }
  enrich(list) {
    return list.map((st, i) => Object.assign({}, st, {
      rank: i + 1,
      fav: !!this.state.favs[st.id],
      nofav: !this.state.favs[st.id],
      onOpen: (e) => { if (e) e.stopPropagation(); this.go('station', { curId: st.id }); },
      onPlay: (e) => { if (e) e.stopPropagation(); this.play(st); },
      onFav: (e) => { if (e) e.stopPropagation(); this.toggleFav(st); }
    }));
  }
  genreCards(list) {
    return list.map((n, i) => {
      const k = (i % 6) + 1;
      return {
        nome: n, tint: 'var(--t' + k + ')', fg: 'var(--tf' + k + ')', blob: 'var(--blob)',
        onOpen: () => this.go('explore', { chip: GENRES.indexOf(n) >= 0 && CHIPS.indexOf(n) >= 0 ? n : 'Todas' })
      };
    });
  }

  renderVals() {
    const s = this.state;
    const by = id => STATIONS.find(x => x.id === id) || STATIONS[0];
    const playing = by(s.playingId);
    const cur = by(s.curId);
    const rio = STATIONS.filter(x => x.uf === 'RJ');
    const sp = STATIONS.filter(x => x.uf === 'SP');

    let ex = STATIONS;
    const c = s.chip;
    if (c === 'Rio de Janeiro') ex = rio;
    else if (c === 'São Paulo') ex = sp;
    else if (c === 'Música') ex = STATIONS.filter(x => ['Pop','Rock','MPB','Sertanejo','Pagode','Flashback'].indexOf(x.genero) >= 0);
    else if (c !== 'Todas') ex = STATIONS.filter(x => x.genero === c);

    const q = s.query.trim().toLowerCase();
    const hits = q ? STATIONS.filter(x =>
      (x.nome + ' ' + x.cidade + ' ' + x.genero + ' ' + x.freq).toLowerCase().indexOf(q) >= 0) : [];
    const cityHits = q ? [
      { nome: 'Rio de Janeiro', n: rio.length, key: 'rio' },
      { nome: 'São Paulo', n: sp.length, key: 'sp' }
    ].filter(x => x.nome.toLowerCase().indexOf(q) >= 0) : [];

    const favIds = Object.keys(s.favs).filter(k => s.favs[k]);
    const favList = s.forceEmptyFav ? [] : STATIONS.filter(x => favIds.indexOf(x.id) >= 0);
    const recents = ['jovempan','jb','alpha','tupi','mixrio','bandfm']
      .map(by).map((x, i) => Object.assign({}, x, { quando: ['agora há pouco','há 40 min','ontem, 22:15','ontem, 18:02','seg, 07:30','dom, 20:44'][i] }));

    const isRio = s.city === 'rio';
    const chrome = ['splash','onb','login'].indexOf(s.screen) < 0;
    const onb = ONB[s.onbStep];

    return {
      app: {
        chrome,
        s_splash: s.screen === 'splash', s_onb: s.screen === 'onb', s_login: s.screen === 'login',
        s_home: s.screen === 'home', s_explore: s.screen === 'explore', s_city: s.screen === 'city',
        s_station: s.screen === 'station', s_search: s.screen === 'search', s_fav: s.screen === 'fav',
        s_recent: s.screen === 'recent', s_genres: s.screen === 'genres', s_settings: s.screen === 'settings',
        s_offline: s.screen === 'offline', s_error: s.screen === 'error',

        greeting: 'Bom dia',
        liveNow: this.enrich([by('jb'), by('jovempan'), by('mixrio'), by('alpha'), by('n93')]),
        destRio: this.enrich(rio.slice(0, 3)),
        destSP: this.enrich(sp.slice(0, 5)),
        maisOuvidas: this.enrich([by('jovempan'), by('alpha'), by('mixsp'), by('jb')]),
        generosMini: this.genreCards(GENRES.slice(0, 6)),
        generos: this.genreCards(GENRES),

        chips: CHIPS.map(n => ({
          nome: n,
          bg: n === c ? 'var(--ink)' : 'transparent',
          fg: n === c ? 'var(--bg)' : 'var(--ink)',
          bd: n === c ? 'var(--ink)' : 'var(--line)',
          onPick: () => this.setState({ chip: n })
        })),
        isGrid: s.view === 'grid', isList: s.view === 'list',
        gridBg: s.view === 'grid' ? 'var(--bg)' : 'transparent',
        listBg: s.view === 'list' ? 'var(--bg)' : 'transparent',
        setGrid: () => this.setState({ view: 'grid' }),
        setList: () => this.setState({ view: 'list' }),
        exploreList: this.enrich(ex),

        cityTitle: isRio ? 'Rádios do Rio de Janeiro' : 'Rádios de São Paulo',
        citySub: isRio ? 'As principais rádios cariocas em um só lugar.' : 'Ouça as principais emissoras paulistas ao vivo.',
        cityHero: isRio ? 'linear-gradient(150deg,#d67f48,#8c491a)' : 'linear-gradient(150deg,#8fa073,#3d472b)',
        cityCount: isRio ? rio.length : sp.length,
        cityList: this.enrich(isRio ? rio : sp),

        cur,
        stHero: cur.g,
        curFav: !!s.favs[cur.id], curNofav: !s.favs[cur.id],
        playCur: () => this.play(cur),
        favCur: () => this.toggleFav(cur),
        similar: this.enrich(STATIONS.filter(x => x.id !== cur.id && (x.genero === cur.genero || x.uf === cur.uf)).slice(0, 5)),

        query: s.query, hasQuery: !!s.query,
        onQuery: e => this.setState({ query: e.target.value }),
        clearQuery: () => this.setState({ query: '' }),
        searchIdle: !q, searchHits: !!q && hits.length > 0, searchEmpty: !!q && hits.length === 0,
        searchList: this.enrich(hits),
        hasCityHits: cityHits.length > 0,
        cityHits: cityHits.map((x, i) => ({
          nome: x.nome, n: x.n, tint: 'var(--t' + (i + 1) + ')', fg: 'var(--tf' + (i + 1) + ')',
          onOpen: () => this.go('city', { city: x.key })
        })),
        recentSearches: ['jb fm','sertanejo','são paulo','notícias'].map(t => ({
          t, onPick: () => this.setState({ query: t })
        })),

        favList: this.enrich(favList),
        hasFavs: favList.length > 0, noFavs: favList.length === 0,
        favCountLabel: favList.length === 1 ? '1 rádio salva' : favList.length + ' rádios salvas',
        recentList: this.enrich(recents),

        isGuest: s.auth !== 'conta',
        isLogged: s.auth === 'conta',
        acctIni: s.auth === 'conta' ? 'A' : '?',
        acctName: s.auth === 'conta' ? 'Ana Ribeiro' : 'Convidado',
        acctSub: s.auth === 'conta' ? 'ana.ribeiro@email.com' : 'ID anônimo · CW-7C1E9F40',
        acctTag: s.auth === 'conta' ? 'CONTA' : 'SEM LOGIN',
        acctTagBg: s.auth === 'conta' ? 'var(--accent-soft)' : 'var(--surf2)',
        acctTagFg: s.auth === 'conta' ? 'var(--accent-ink)' : 'var(--ink60)',
        anonId: 'CW-7C1E9F40',
        doGuest: () => this.go('home', { auth: 'anon' }),
        settingsRows: [{ t: 'Conta' }, { t: 'Notificações' }, { t: 'Privacidade' }, { t: 'Sobre o Carra Wave' }],
        autoplay: s.autoplay,
        apBg: s.autoplay ? 'var(--accent)' : 'var(--surf2)',
        apJustify: s.autoplay ? 'flex-end' : 'flex-start',
        toggleAutoplay: () => this.setState(p => ({ autoplay: !p.autoplay })),

        playing, playBg: playing.g,
        isPlaying: s.isPlaying, isPaused: !s.isPlaying,
        showMini: chrome && !s.playerOpen,
        playerOpen: s.playerOpen,
        waveOpacity: s.isPlaying ? '1' : '.25',
        nowPlayingLabel: s.isPlaying ? 'Programação ao vivo' : 'Pausado',
        volPct: '68%',
        playFav: !!s.favs[playing.id], playNofav: !s.favs[playing.id],
        favPlaying: () => this.toggleFav(playing),
        togglePlay: (e) => { if (e) e.stopPropagation(); this.setState(p => ({ isPlaying: !p.isPlaying })); },
        openPlayer: () => this.setState({ playerOpen: true }),
        closePlayer: () => this.setState({ playerOpen: false }),
        openStationFromPlayer: () => this.go('station', { curId: playing.id }),

        timerOpen: s.timerOpen,
        openTimer: (e) => { if (e) e.stopPropagation(); this.setState({ timerOpen: true }); },
        closeTimer: () => this.setState({ timerOpen: false }),
        clearTimer: () => this.setState({ timer: null, timerOpen: false }),
        timerActive: !!s.timer,
        timerRemaining: s.timer === '1 hora' ? '58 min' : (s.timer ? parseInt(s.timer, 10) - 2 + ' min' : ''),
        timerLabel: s.timer || 'Desligado',
        timerColor: s.timer ? 'var(--accent)' : 'var(--ink60)',
        timerChipBg: s.timer ? 'var(--accent-soft)' : 'var(--surf)',
        timerOptions: TIMERS.map(t => ({
          label: t, on: s.timer === t,
          bg: s.timer === t ? 'var(--accent-soft)' : 'transparent',
          fg: s.timer === t ? 'var(--accent-ink)' : 'var(--ink)',
          onPick: () => { this.setState({ timer: t, timerOpen: false }); this.flash('Temporizador: ' + t); }
        })),

        onbTitle: onb[0], onbBody: onb[1], onbGlyph: onb[2],
        onbCta: s.onbStep === 2 ? 'Começar' : 'Continuar',
        dot1w: s.onbStep === 0 ? '26px' : '7px', dot1c: s.onbStep === 0 ? 'var(--accent)' : 'var(--line)',
        dot2w: s.onbStep === 1 ? '26px' : '7px', dot2c: s.onbStep === 1 ? 'var(--accent)' : 'var(--line)',
        dot3w: s.onbStep === 2 ? '26px' : '7px', dot3c: s.onbStep === 2 ? 'var(--accent)' : 'var(--line)',
        nextOnb: () => s.onbStep < 2 ? this.setState(p => ({ onbStep: p.onbStep + 1 })) : this.go('login'),
        skipOnb: () => this.go('login'),
        doLogin: () => this.go('home', { auth: 'conta' }),

        goHome: () => this.go('home'), goExplore: () => this.go('explore'),
        goFav: () => this.go('fav', { forceEmptyFav: false }), goSearch: () => this.go('search'),
        goRio: () => this.go('city', { city: 'rio' }), goSP: () => this.go('city', { city: 'sp' }),
        goGenres: () => this.go('genres'), goSettings: () => this.go('settings'),
        goRecent: () => this.go('recent'),
        goOffline: () => this.go('offline'), goError: () => this.go('error'),
        retry: () => this.go('home'),
        goBack: () => this.go(s.prev === s.screen ? 'home' : s.prev),
        navHomeC: s.screen === 'home' ? 'var(--accent)' : 'var(--ink40)',
        navExpC: ['explore','city','genres'].indexOf(s.screen) >= 0 ? 'var(--accent)' : 'var(--ink40)',
        navFavC: s.screen === 'fav' ? 'var(--accent)' : 'var(--ink40)',
        navSearchC: s.screen === 'search' ? 'var(--accent)' : 'var(--ink40)',
        toast: s.toast
      },
      rail: RAIL.map((r, i) => ({
        n: (i + 1) < 10 ? '0' + (i + 1) : '' + (i + 1),
        label: r[1],
        bg: s.rail === r[0] ? '#201e1d' : 'transparent',
        fg: s.rail === r[0] ? '#f5ead8' : 'rgba(32,30,29,.78)',
        onPick: () => this.jump(r[0])
      }))
    };
  }
}
</script>
</body>
</html>
